name: Toqi isolated upload method test
on:
  push:
    branches:
      - toqi-upload-method-test-20261120
    paths:
      - .github/workflows/toqi-upload-method-test.yml
permissions:
  contents: write
jobs:
  test-write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Commit marker and remove workflow
        run: |
          printf "GitHub Actions contents:write test succeeded.\n" > .toqi-actions-test-marker
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .toqi-actions-test-marker
          git rm .github/workflows/toqi-upload-method-test.yml
          git commit -m "Test Actions branch write and remove test workflow"
          git push origin HEAD:refs/heads/toqi-upload-method-test-20261120
