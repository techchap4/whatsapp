name: One-time draft integration
on:
  push:
    branches: [draft-local-sound-import-20261120]
    paths: [.github/workflows/one-time-local-sounds.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply changes
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          hashes = {'app.js': '2e21b056a3bfde73921e437ba6aa70d5ce6f3bc8d3a32c1677e34b723d2f55e0', 'extras.js': 'ad871c967affc5c9953ebd340388724aadaf19aef66b804c2fb70b0e6c0f81ea', 'index.html': '893f2086eb5bc398ed484ecf1b22331e28a2ff627cd500d1aa00bb7eccf4a5b2', 'local-sounds.js': '38a1249b7609d1f7f4477852497a4df8139b383585151f392993bdfffe410931', 'test-local-sounds.py': '4e1c20e916a9a587e385d8647ff56a6360953e86c4a0c5b65283a5afd1af0338'}
          patches = {'app.js': [('const playReceive = () => { if (soundOn()) { tone(880, 0, 0.16); tone(1175, 0.16, 0.28); } };\n', 'const defaultReceive = () => { tone(880, 0, 0.16); tone(1175, 0.16, 0.28); };\nconst playReceive = () => {\n  if (!soundOn()) return;\n  try {\n    if (!window.RadaSounds) return defaultReceive();\n    Promise.resolve(window.RadaSounds.play(defaultReceive)).catch(() => {});\n  } catch (e) { /* playback/storage failure must not interrupt chat */ }\n};\n')], 'extras.js': [('  pane.innerHTML = h;\n', "  pane.innerHTML = h;\n  if (settingsView === 'notif' && window.RadaSounds) window.RadaSounds.mount(pane, defaultReceive);\n")], 'index.html': [('<script src="config.js"></script>\n', '<script src="config.js"></script>\n<script src="local-sounds.js"></script>\n')]}
          for name, expected in hashes.items():
              if hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected: raise SystemExit('Unexpected hash for ' + name)
          for name, changes in patches.items():
              p = Path(name); data = p.read_text()
              for old, new in changes:
                  if not old or data.count(old) != 1: raise SystemExit('Nonunique patch: ' + name)
                  data = data.replace(old, new, 1)
              p.write_text(data)
          PY
          rm .github/workflows/one-time-local-sounds.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js extras.js index.html .github/workflows/one-time-local-sounds.yml
          git commit -m 'Integrate local notification sounds'
          git push origin HEAD:draft-local-sound-import-20261120
