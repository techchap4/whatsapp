name: Add Rada login icon once
on:
  push:
    branches: [main]
    paths: [.github/workflows/add-rada-login-icon.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply login icon and remove this workflow
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, base64
          p=Path('index.html')
          assert hashlib.sha256(p.read_bytes()).hexdigest() == 'b20b597c1e56499339da570de3cc0d40edc4e7b0f0a2439ca47629ce51056a63', "index changed; stopping safely"
          old='<section id="auth" class="hidden">\n  <div class="auth-card">\n    <div class="logo">💬</div>'
          new='<section id="auth" class="hidden">\n  <div class="auth-card">\n    <div class="logo"><img src="rada-login-icon.png" alt="Rada logo" width="72" height="72" style="display:block;margin:auto"></div>'
          s=p.read_text(encoding='utf-8')
          assert s.count(old)==1, "unexpected login layout"
          Path('rada-login-icon.png').write_bytes(base64.b64decode(''))
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-rada-login-icon.yml
          git add index.html rada-login-icon.png
          git commit -m 'Add Rada icon to login screen'
          git push origin HEAD:main
