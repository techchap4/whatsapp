name: Install original Rada tones in draft branch
on:
  push:
    branches: [draft-local-sound-import-20261120]
    paths: [.github/workflows/toqi-original-tones.yml]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed draft patch and remove temporary workflow
        run: |
          test "$(git rev-parse HEAD^)" = "54dd8ad7294f702ace9489c72d973da8808e301f"
          python3 -c 'import base64,gzip; open("/tmp/rada.patch","wb").write(gzip.decompress(base64.b64decode("")))'
          git apply --check /tmp/rada.patch
          git apply /tmp/rada.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js extras.js index.html local-sounds.js original-tones.js test-local-sounds.py
          git rm .github/workflows/toqi-original-tones.yml
          git commit -m "Add original synthesized notification alternatives"
          git push origin HEAD:refs/heads/draft-local-sound-import-20261120
