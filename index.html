<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#008069">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="ChatApp">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="ChatApp">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="ChatApp: chat, status, voice and video calls.">
  <title>ChatApp</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="extras.css">
</head>
<body>

<!-- ============ LOGIN / SIGN UP ============ -->
<div id="splash"><div class="logo">💬</div></div>
<section id="auth" class="hidden">
  <div class="auth-card">
    <div class="logo">💬</div>
    <h1>ChatApp</h1>
    <div class="auth-tabs" id="auth-tabs">
      <button id="tab-login" class="active" type="button">Log in</button>
      <button id="tab-signup" type="button">Sign up</button>
    </div>
    <form id="auth-form" autocomplete="on">
      <div id="signup-fields" class="hidden">
        <label>Full name
          <input id="f-name" type="text" placeholder="Jane Doe" autocomplete="name">
        </label>
        <label>Username
          <input id="f-username" type="text" placeholder="jane_doe" autocomplete="username">
        </label>
      </div>
      <label>Email
        <input id="f-email" type="email" required placeholder="you@example.com" autocomplete="email">
      </label>
      <label>Password
        <input id="f-password" type="password" required minlength="6" placeholder="At least 6 characters" autocomplete="current-password">
      </label>
      <div id="signup-confirm" class="hidden">
        <label>Confirm password
          <input id="f-password2" type="password" placeholder="Type the password again" autocomplete="new-password">
        </label>
      </div>
      <p id="auth-msg" class="auth-msg"></p>
      <button id="auth-submit" class="primary" type="submit">Log in</button>
    </form>

    <!-- shown only in a normal browser tab, hidden once installed -->
    <button id="install-auth" class="install-pill hidden" type="button">⬇&nbsp; Install ChatApp</button>

    <!-- 8-digit email code step -->
    <form id="otp-form" class="hidden" autocomplete="off">
      <p class="otp-help">We sent an 8-digit code to <b id="otp-email"></b>. Enter it to verify your account.</p>
      <input id="f-otp" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="one-time-code" placeholder="00000000" required>
      <p id="otp-msg" class="auth-msg"></p>
      <button id="otp-submit" class="primary" type="submit">Verify</button>
      <div class="otp-links">
        <button id="otp-resend" type="button">Resend code</button>
        <button id="otp-back" type="button">Back</button>
      </div>
    </form>
  </div>
</section>

<!-- ============ MAIN APP ============ -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <header class="sb-head">
      <div id="me-avatar" class="clickable" title="My profile"></div>
      <div class="sb-actions">
        <button id="btn-install" class="hidden" type="button" title="Install app" aria-label="Install app">⬇</button>
        <button id="btn-new" title="New chat">＋</button>
        <button id="btn-logout" title="Log out">⏻</button>
      </div>
    </header>

    <nav class="tabs">
      <button data-tab="chats" class="active">Chats <span id="unread-total" class="badge hidden"></span></button>
      <button data-tab="status">Status</button>
      <button data-tab="profile">Profile</button>
      <button data-tab="settings">Settings</button>
    </nav>

    <div id="pane-chats" class="pane">
      <div class="search"><input id="search" type="search" placeholder="Search chats"></div>
      <div id="chat-list"></div>
    </div>
    <div id="pane-status" class="pane hidden"></div>
    <div id="pane-profile" class="pane hidden"></div>
    <div id="pane-settings" class="pane hidden"></div>
  </aside>

  <main class="chat">
    <div id="empty">
      <div class="empty-icon">💬</div>
      <h2>ChatApp</h2>
      <p>Pick a chat on the left, or tap ＋ to message someone new.</p>
    </div>

    <div id="conv" class="hidden">
      <header class="conv-head">
        <button id="btn-back" class="back" title="Back">←</button>
        <div id="conv-avatar"></div>
        <div class="conv-info">
          <div id="conv-name" class="name"></div>
          <div id="conv-sub" class="sub"></div>
        </div>
        <div class="conv-actions">
          <button id="btn-vcall" class="icon-btn" type="button" title="Video call" aria-label="Video call">📹</button>
          <button id="btn-acall" class="icon-btn" type="button" title="Voice call" aria-label="Voice call">📞</button>
          <button id="btn-theme" class="icon-btn" title="Chat theme">🎨</button>
        </div>
      </header>
      <div id="messages"></div>
      <form id="composer">
        <label class="icon-btn" title="Send photo, video, audio or music">📎<input id="attach-file" type="file" accept="image/*,video/*,audio/*,.mp3,.m4a,.wav,.ogg,.aac,.flac" multiple hidden></label>
        <textarea id="msg-input" rows="1" placeholder="Type a message" maxlength="4000"></textarea>
        <button id="btn-rec" class="icon-btn" type="button" title="Record a voice note">🎤</button>
        <button class="send" type="submit" title="Send">➤</button>
      </form>
      <div id="rec-bar" class="hidden">
        <button id="rec-cancel" class="icon-btn" type="button" title="Cancel">🗑</button>
        <span class="rec-dot"></span><span id="rec-time">0:00</span>
        <button id="rec-send" class="send" type="button" title="Send voice note">➤</button>
      </div>
    </div>
  </main>
</div>

<!-- ============ INSTALL (browser only) ============ -->
<div id="install-banner" class="hidden" role="region" aria-label="Install app">
  <img src="icon-192.png" alt="" width="40" height="40">
  <div class="ib-text"><b>Install ChatApp</b><span>Full screen, faster, with call alerts</span></div>
  <button id="install-banner-btn" class="ib-go" type="button">Install</button>
  <button id="install-banner-x" class="ib-x" type="button" aria-label="Dismiss">✕</button>
</div>

<div id="modal-install" class="modal hidden">
  <div class="modal-card">
    <header><button class="close" type="button" data-close-install>✕</button><h3>Install ChatApp</h3></header>
    <div class="install-help"><div id="install-help-body"></div></div>
  </div>
</div>

<!-- ============ MODALS ============ -->
<div id="modal-contacts" class="modal hidden">
  <div class="modal-card">
    <header><button class="close" data-close>✕</button><h3>New chat</h3></header>
    <div class="search"><input id="contact-search" type="search" placeholder="Search by name or username"></div>
    <div id="contact-list"></div>
  </div>
</div>

<div id="modal-status" class="modal hidden">
  <div class="modal-card">
    <header><button class="close" data-close>✕</button><h3>Add status</h3></header>
    <div class="status-compose">
      <div id="status-preview" class="status-preview" style="background:#00a884">
        <textarea id="status-text" placeholder="Type a status" maxlength="300"></textarea>
        <img id="status-img" class="hidden" alt="">
      </div>
      <div id="status-colors" class="colors"></div>
      <div class="row">
        <label class="btn-file">📷 Add photo<input id="status-file" type="file" accept="image/*" hidden></label>
        <button id="status-post" class="primary">Post status</button>
      </div>
      <p id="status-msg" class="auth-msg"></p>
    </div>
  </div>
</div>

<div id="modal-theme" class="modal hidden">
  <div class="modal-card">
    <header><button class="close" data-close>✕</button><h3>Chat theme</h3></header>
    <div id="theme-list" class="theme-list"></div>
  </div>
</div>

<div id="status-viewer" class="hidden">
  <div id="sv-bars"></div>
  <header>
    <div id="sv-avatar"></div>
    <div><div id="sv-name" class="name"></div><div id="sv-time" class="sub"></div></div>
    <button id="sv-delete" class="hidden" title="Delete status">🗑</button>
    <button id="sv-close" title="Close">✕</button>
  </header>
  <div id="sv-body"></div>
  <button id="sv-views" class="hidden"></button>
  <div id="sv-viewers" class="hidden"></div>
  <button id="sv-prev" class="sv-nav left" aria-label="Previous"></button>
  <button id="sv-next" class="sv-nav right" aria-label="Next"></button>
</div>

<!-- ============ CALL SCREEN (voice + video) ============ -->
<div id="call" class="hidden">
  <video id="call-remote" autoplay playsinline></video>
  <video id="call-local" autoplay playsinline muted></video>
  <div class="call-top">
    <div id="call-avatar"></div>
    <div id="call-name"></div>
    <div id="call-status"></div>
  </div>
  <div class="call-actions in-actions">
    <button id="call-decline" class="cbtn decline" type="button" title="Decline" aria-label="Decline"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
    <button id="call-accept" class="cbtn accept" type="button" title="Accept" aria-label="Accept"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
  </div>
  <div class="call-actions live-actions">
    <button id="call-cam" class="cbtn hidden" type="button" title="Camera on/off" aria-label="Camera on or off">📷</button>
    <button id="call-flip" class="cbtn hidden" type="button" title="Switch camera" aria-label="Switch camera">🔄</button>
    <button id="call-mute" class="cbtn" type="button" title="Mute" aria-label="Mute microphone">🎤</button>
    <button id="call-end" class="cbtn end" type="button" title="End call" aria-label="End call"><svg viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg></button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
<script src="extras.js"></script>
<script src="pwa.js"></script>
</body>
</html>
